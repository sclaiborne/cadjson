name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        env:
          PYTHONIOENCODING: utf-8
        run: python -m pytest -q
      - name: Build the examples
        env:
          PYTHONIOENCODING: utf-8
        run: python -m cadjson.cli build examples/*.json --no-sheet --no-png
        shell: bash
