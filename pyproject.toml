[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cadjson"
version = "0.3.1"
description = "JSON feature-tree to CAD (STEP, STL, 2D drawings) via build123d"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "sclaiborne" }]
urls = { Homepage = "https://github.com/sclaiborne/CAD-Generator" }
dependencies = [
    # draftwright pins build123d <0.11 on Python <3.13, so accept 0.10 too
    "build123d>=0.10,<0.12",
    "pydantic>=2.7",
    "click>=8.1",
    "resvg-py>=0.1",
    # threads; 0.3 requires build123d 0.11.1 which draftwright forbids on Python < 3.13
    "bd_warehouse>=0.2,<0.3",
    # cadjson compare (mesh distance against a reference STL)
    "trimesh>=4",
    "rtree>=1",
]

[project.optional-dependencies]
# dimensioned drawing sheets; draftwright is AGPL-3 (see README, Licensing)
sheets = ["draftwright>=0.4.28"]
# run `export-python --cadgen` scripts in the same environment (text-to-cad; its API moves fast)
cadgen = ["cadgen>=0.5.1,<0.6"]
dev = [
    "pytest>=8",
    "draftwright>=0.4.28",
]

[project.scripts]
cadjson = "cadjson.cli:main"

[tool.setuptools.package-data]
cadjson = ["skill/SKILL.md"]

[tool.setuptools.packages.find]
include = ["cadjson*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: takes several seconds (drawing sheets)"]
